<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cancionero</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1c1a; --muted: #77746d; --line: #e4e1d9;
    --card: #ffffff; --accent: #b4491f; --chord: #b4491f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513; --fg: #ece9e2; --muted: #9a968c; --line: #2d2b27;
      --card: #1f1d1a; --accent: #f08a5d; --chord: #f4a97f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161513; --fg: #ece9e2; --muted: #9a968c; --line: #2d2b27;
    --card: #1f1d1a; --accent: #f08a5d; --chord: #f4a97f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 12px 16px;
  }
  .bar { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  h1 { font-size: 18px; margin: 0 8px 0 0; cursor: pointer; white-space: nowrap; }
  input[type=search] {
    flex: 1; min-width: 0; padding: 9px 12px; font: inherit; color: var(--fg);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  }
  button {
    font: inherit; color: var(--fg); background: var(--card); cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .count { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }
  .item {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 12px 14px; margin-bottom: 8px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
    text-decoration: none; color: inherit;
  }
  .item:hover { border-color: var(--accent); }
  .item .t { font-weight: 600; }
  .item .a { color: var(--muted); font-size: 14px; }
  .item .k { color: var(--accent); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .back { margin-bottom: 12px; }
  .song-head h2 { margin: 0; font-size: 24px; }
  .song-head .a { color: var(--muted); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0; }
  .tools .grp { display: flex; align-items: center; gap: 4px; }
  .tools .lbl { color: var(--muted); font-size: 14px; margin-right: 2px; }
  .tools .val { min-width: 3.2em; text-align: center; font-weight: 600; }
  pre {
    margin: 0; padding: 16px; overflow-x: auto; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; font-size: var(--fs, 15px);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; line-height: 1.35;
  }
  pre .c { color: var(--chord); font-weight: 700; }
  pre .s { color: var(--muted); font-weight: 600; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0 40px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="home">🎸 Cancionero</h1>
    <input id="q" type="search" placeholder="Buscar título, artista o letra…" autocomplete="off">
    <button id="rand" class="primary" title="Tema al azar">🎲</button>
    <button id="theme" title="Cambiar tema">◐</button>
  </div>
</header>
<main id="app"></main>
<footer id="foot"></footer>

a\nBm                    D             G            D\nPuede que muera con una verdad olvidada en tu memoria\nF#(*)                  A\nserá un camino que no tiene huella\nF#(*)                    Bm\nla suerte que le ha tocado a la estrella\nG       D       F#(*)\nque te ha de mirar\nBm                     D                G             D\nHay un siempre para la batalla y la razón que te demora\nBm                   D          G           D\ny hay una sombra para cada luz corras adonde corras\nF#(*)                    A\nquizá el destino sea una mentira\nF#(*)                   Bm           G\nquizá lo único que quería la vida era\nD            F#(*)\nterminar con vos\n\nInter: Bm D Em, Bm Em D (x 2)\n\nBm              D                G            D\nLa ruta sigue mas allá de las luces de la autopista\nBm              D                G            D\nsecando al ojo de la lágrima te perderás de vista\nBm              D                G            D\ncomo un relámpago en la fría noche, cruzarás los abismos\nBm              D                G            D\nesos que guardan a la sombra que te oculta de vos mismo\nF#(*)                    A\nhay algo extraño ahí del otro lado\nF#(*)            Bm\nque te teme y te da la mano\nG        D          F#(*)\npara llegar hasta vos.\n\nSolo sobre estrofa\n\nInter: Bm D Em, Bm Em D (x 2)\n\nBm                      D                G          D\nHay un destino que no tiene pruebas por eso esta historia\nBm                    D             G            D\nYa habrá muerto con una verdad olvidada en tu memoria\nF#(*)                  A\nserá un camino que no tiene huella\nF#(*)                    Bm\nla suerte que le ha tocado a la estrella\nG       D       F#(*)\nque te ha de mirar\nBm                     D                G             D\nHabrá un siempre para la batalla y la razón que te demora\nBm                   D          G           D\ny hay una sombra para cada luz corras adonde corras\nF#(*)                    A\nquizá el destino sea una mentira\nF#(*)                   Bm           G\nquizá lo único que quería la vida era\nD            F#(*)\nterminar con vos"}, {"id": "gustavo-cerati-me-quedo-aqui", "title": "Me quedo aquí", "artist": "Gustavo Cerati", "key": "D", "body": "Versión estudio\n\nAcordes:\n\n+---------+----------+\n| Tono    |  EADGBe  |\n+---------+----------+\n| D       | [xx0232] |\n| F#m     | [244222] |\n| C       | [x32010] |\n| Em      | [022000] |\n| A       | [x02220] |\n| Bm      | [x24432] |\n| G       | [320033] |\n| Gm      | [355333] |\n| C*      | [x35553] |\n| F       | [133211] |\n| Am      | [x02210] |\n| C7      | [x32310] |\n| D*      | [x57775] |\n+---------+----------+\n\n\nD         F#m\n    Espera\nC           Em\n    no te enojes esta vez\nD       F#m\n    lo vi venir\nC           Em\n    como siempre la reacción\n\nA   Bm       G      C     Bm\n    es tan lenta como mi voz\nA   Bm    G       Em    A\n    arrasando con la razón\nA   Bm      Em      C         G\n    el tsunami llegó hasta aquí\nGm     C*        D   F#m\n    lo vi venir\n\nC              Em\n    Si aprendemos la lección\nD        F#m\n    sabrás que al fin\nC          Em\n    el misterio es contradicción\n\nA       Bm      G         C    Bm\n    con todo aquello que conoces\nA     Bm     G      Em      A\n    a veces hago todo al revés\nA   Bm     Em       C        G\n    el tsunami llegó hasta aquí\nGm     C*\n    lo vi venir\n\nD\n\nEm             Bm\n    Todo se movió\nEm                 C\n    y es mejor quedarse quieto\nEm              Bm\n    pronto saldrá el sol\nEm               C\n    y algún daño repondremos\n    G            A\n    terco como soy\nGm      C*\n    me quedo aquí\n\nD\n\nEm                Bm\n    La tinta no seco\nEm                      C\n    y en palabras dije muchas cosas\nEm               Bm\n    pero en mi corazón\nEm                 F           Am\n    todavía queda tanto por decir\n     F           Am\n    tanto por decir\n     F            C\n m                    E\nhace un frío despiadado, humedecido y triste\n              (A Asus4 A) x2\nfuera de estación\n\nEstribillo\n\n    D            E\nAparecen cuando desaparecés\n    A           A7            F#\nlos ojos del insomnio, las palmadas compasivas\n     Bm          E   D   A\noscurece cuando desaparecés\n\nEstrofa\n\nElla dijo: ciudad, o verano,\nnunca las dos cosas juntas, no\nese cóctel y el amor son enemigos casi por definición\"\n\nEstribillo\n\nAparecen cuando desaparecés\nlos síntomas nihilistas, las canciones en tonos menores\nhuele a poco y desaparecés\n\nSolo: (Bm - E - A Asus4 A) x2\n\nEstrofa\n\nRecluido y sin niguna perspectiva de cruzar la habitación\nni siquiera entre tus brazos, y la gente preguntándome por vos\n\nEstribillo\n\nAparecen cuando desaparecés\nlos diálogos con las paredes\nlos estragos de tu ausencia\noscurece y desaparecés."}, {"id": "los-piojos-ruleta", "title": "Ruleta", "artist": "Los Piojos", "key": "D", "body": "Ukulele\nCharango\n\nIntro\nD            Bm          A          (4 veces)\n\n\nD            Bm          A\nEn Comodoro rasgaste mi piel\nD              Bm          A\nun largo viaje al desierto cruel\nD                 Bm      A     D           Bm       A\ntus ojos verdes, oasis para mi sed.\n\n\nD            Bm           A\nDe la ruleta te quiero llevar,\nD                       Bm          A\nroja la sangre verde el paño de la libertad,\nD                             Bm          A      D        Bm        A\npero mi suerte es negra, mis dientes van a estallar.\nD            Bm           A         E        Esus4      E\nOh, oh...\n\n\nD\nComo vas girando voy\nA\ndónde vas a parar hoy\nG\ntengo ya hasta la mitad\nG\ntoda bien cubierta ves\nF#m7             C#m7                E       Esus4      E\nsobre mi calle estás y yo ya te coroné.\nD\nY toda mi vida aquí\nA\nestoy apostando oh\nG\ngirando la bola va\nG\ndónde vas a parar hoy,\nF#m7             C#m7                E       Esus4      E\nsobre mi calle est ----\nD|-------------13----|----|------------------------------------\nA|-------------------|----|------------------------------------\nE|-------------------|----|------------------------------------\n  Riff 2         Riff 3    Riff 4             Riff 5\ne|-------------|---------|------7-----------|--------|\nB|-------------|---------|------------------|-----7--|\nG|-6b/-6//---4-|-6ba-4-4-|-6b/----6//-6p4-4-|-6s8----|\nD|-------------|---------|------------------|--------|\nA|-------------|---------|------------------|--------|\nE|-------------|---------|------------------|--------|\n  Riff 6                Riff 7             Riff 8    Riff 9\ne|--------------------|------------------|---------|-----------\nB|----7----7----7-----|------------------|---------|-----------\nG|-6b---6b---6b---6---|-6b/-6/-6/-6/-6//-|-1s13-13v|-6ba-p4----\nD|------------------4-|------------------|---------|--------4--\nA|--------------------|------------------|---------|-----------\nE|--------------------|------------------|---------|-----------\n\nB                        E\nSolo voy, solo hoy me siento\n\nF#   Riff 2     E            B\nColgando del estribo siempre voy\n\nB                                E     Riff 3\nCortando calles sin saber quien cruzara\n\n    F#        E            B   Riff 1\nY dejarme donde quería llegar\n\n   B Riff 4                    E\nYo no saque boletos a este infierno\n\n F#  Riff 5   E          B  Riff 6\nGente triste veo al caminar\n\nF#                  B         Riff 7\nMi facultad ha sido esta calle\n\nF#                  B  Riff 1\nQuise ser así como soy\n\nB         Riff 4\nY como un perro voy\n\n                        E  Riff 8\nSiguiendo el sol sin saber que hacer\n\n             B Riff 9  F#       B\nMas pasa el tiempo       más 25 soy\n\n  Solo\ne|-------------------------------------------------------------\nB|-------------------------------------------------------------\nG|-6-4v--6-7--7s9--7-6-7--6-4v---6-7--7s9--7-6-4--7s9--6-------\nD|-------------------------------------------------------------\nA|-------------------------------------------------------------\nE|-------------------------------------------------------------\n\n\ne|-------------------------------------------------------------\nB|-------------------------------------------------------------\nG|-6-7--7s9--7-6-4--7-6-4---6-7--7s9--7-6-7--6-4v---6-7--7s9---\nD|-------------------------------------------------------------\nA|-------------------------------------------------------------\nE|-------------------------------------------------------------\n\n\ne|-------------------------------------------------------------\nB|-------------------------------------------------------------\nG|-7-6-7--6-4v----6-7--7s9--7-6-4--7-7-7-7s6---6-7--7s9--7-6-4-\nD|-------------------------------------------------------------\nA|-------------------------------------------------------------\nE|-------------------------------------------------------------\n\n\ne|---------------------------------\nB|--------------5-------7-------9--\nG|-7-6-4----4s6----6s8-----8s10----\nD|---------------------------------\nA|---------------------------------\nE|---------------------------------\n\n\n      B                         E\nDesde mi rodar ya ni se que se hicieron\n\n         F#           E                  B     Riff 1\nDe esas cosas que pudieron ser y que no fueron\n\n     B                                E  Riff 3\nMás gente voy conociendo mas solo me siento\n\n       F#               E             B\nPero siempre busco esa buena satisfacción\n\nB                            E\nNomade soy nuevo lugar buscare\n\n       F#         E         B\nY como dije mi camino seguiré\n\n\nSolo\n\ne|-------------------------------------------------------------\nB|-------------------------------------------------------------\nG|-6-4v--6-7--7s9--7-6-7--6-4v---6-7--7s9--7-6-4--7s9--6-------\nD|-------------------------------------------------------------\nA|------------------------   var app = document.getElementById('app');
  var q = document.getElementById('q');
  var state = { transpose: 0, fs: 15 };

  function store(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  state.fs = parseInt(store('fs'), 10) || 15;
  var savedTheme = store('theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  /* ---------- acordes ---------- */
  var SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  var CH = '([A-G][#b]?)((?:maj|min|m|dim|aug|sus|add)?\\d*)(?:\\/([A-G][#b]?))?(\\(\\*\\)|\\*)?';
  var CHORD = new RegExp('^' + CH + '$');
  // token de acordes: "Am", "F#(*)", "Cm*", "G-A-D", "Bm-C#m", "Em,"
  var CHORDTOK = new RegExp('^\\(?' + CH + '(?:-' + CH + ')*\\)?,?$');
  var CHORDG = new RegExp(CH, 'g');
  var LABEL = /^[A-Za-zñÑ]+:$/;
  var FILLER = /^(-+|\(?[xX]\d*\)?|\d+\)?|\(\d+|veces\)?|[Rr]iff|\||\(|\))$/;

  function idx(n) {
    var i = SHARP.indexOf(n);
    return i >= 0 ? i : FLAT.indexOf(n);
  }
  function shiftNote(n, by) {
    var i = idx(n);
    if (i < 0) return n;
    var scale = n.indexOf('b') > 0 ? FLAT : SHARP;
    return scale[((i + by) % 12 + 12) % 12];
  }
  function shiftToken(tok, by) {
    if (!CHORDTOK.test(tok)) return tok;
    return tok.replace(CHORDG, function (_, root, qual, bass, star) {
      return shiftNote(root, by) + qual + (bass ? '/' + shiftNote(bass, by) : '') + (star || '');
    });
  }
  function isChordLine(line) {
    var toks = line.trim().split(/\s+/).filter(Boolean);
    if (toks.length && LABEL.test(toks[0])) toks.shift();   // "Intro:" / "Inter:"
    var n = 0;
    for (var i = 0; i < toks.length; i++) {
      if (CHORDTOK.test(toks[i])) n++;
      else if (!FILLER.test(toks[i])) return false;
    }
    return n > 0;
  }
  // Transpone manteniendo la alineación con la letra
  function transposeLine(line, by) {
    var parts = line.match(/\s+|\S+/g) || [];
    var carry = 0, out = '', first = true;
    parts.forEach(function (p) {
      if (/^\s/.test(p)) {
        var n = Math.max(1, p.length - carry);
        carry -= p.length - n;
        out += new Array(n + 1).join(' ');
      } else {
        var t = (first && LABEL.test(p)) ? p : shiftToken(p, by);
        first = false;
        carry += t.length - p.length;
        out += t;
      }
    });
    return out;
  }
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function renderBody(body, by) {
    return body.split('\n').map(function (line) {
      if (isChordLine(line)) {
        return '<span class="c">' + esc(by ? transposeLine(line, by) : line) + '</span>';
      }
      if (/^\s*(ESTRIBILLO|VERSO|PUENTE|INTRO|SOLO|CORO)\b/.test(line)) {
        return '<span class="s">' + esc(line) + '</span>';
      }
      return esc(line);
    }).join('\n');
  }
  function fmtKey(k, by) {
    if (!k) return '';
    var m = /^([A-G][#b]?)(.*)$/.exec(k);
    return m ? shiftNote(m[1], by) + m[2] : k;
  }
  function norm(s) {
    return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  /* ---------- vistas ---------- */
  function filtered() {
    var t = norm(q.value.trim());
    if (!t) return SONGS;
    return SONGS.filter(function (s) {
      return norm(s.title + ' ' + s.artist + ' ' + s.body).indexOf(t) >= 0;
    });
  }
  function showList() {
    var list = filtered();
    var html = '<div class="count">' + list.length + ' de ' + SONGS.length + ' canciones</div>';
    if (!list.length) html += '<div class="empty">No hay resultados</div>';
    list.forEach(function (s) {
      html += '<a class="item" href="#' + encodeURIComponent(s.id) + '">' +
        '<span><span class="t">' + esc(s.title) + '</span><br><span class="a">' + esc(s.artist) + '</span></span>' +
        '<span class="k">' + esc(s.key) + '</span></a>';
    });
    app.innerHTML = html;
  }
  function showSong(s) {
    var by = state.transpose;
    var sign = by > 0 ? '+' + by : String(by);
    app.innerHTML =
      '<button class="back" id="back">← Todas</button>' +
      '<div class="song-head"><h2>' + esc(s.title) + '</h2><div class="a">' + esc(s.artist) + '</div></div>' +
      '<div class="tools">' +
        '<div class="grp"><span class="lbl">Tono</span>' +
          '<button data-t="-1">−</button><span class="val">' + esc(fmtKey(s.key, by) || sign) + '</span>' +
          '<button data-t="1">+</button>' +
          (by ? '<button data-t="0" title="Restablecer">↺</button>' : '') + '</div>' +
        '<div class="grp"><span class="lbl">Letra</span>' +
          '<button data-f="-1">A−</button><button data-f="1">A+</button></div>' +
        '<button id="again">🎲 Otro</button>' +
      '</div>' +
      '<pre style="--fs:' + state.fs + 'px">' + renderBody(s.body, by) + '</pre>';
    document.getElementById('back').onclick = function () { location.hash = ''; };
    document.getElementById('again').onclick = function () { randomSong(s.id); };
    app.querySelectorAll('[data-t]').forEach(function (b) {
      b.onclick = function () {
        var v = parseInt(b.getAttribute('data-t'), 10);
        state.transpose = v === 0 ? 0 : state.transpose + v;
        showSong(s);
      };
    });
    app.querySelectorAll('[data-f]').forEach(function (b) {
      b.onclick = function () {
        state.fs = Math.min(28, Math.max(10, state.fs + parseInt(b.getAttribute('data-f'), 10)));
        store('fs', String(state.fs));
        showSong(s);
      };
    });
    document.title = s.title + ' — Cancionero';
  }
  function route() {
    var id = decodeURIComponent(location.hash.replace(/^#/, ''));
    var s = SONGS.filter(function (x) { return x.id === id; })[0];
    if (s) { showSong(s); window.scrollTo(0, 0); }
    else { document.title = 'Cancionero'; showList(); }
  }
  function randomSong(exceptId) {
    var pool = filtered();
    if (pool.length > 1 && exceptId) pool = pool.filter(function (s) { return s.id !== exceptId; });
    if (!pool.length) return;
    var s = pool[Math.floor(Math.random() * pool.length)];
    state.transpose = 0;
    if (location.hash === '#' + encodeURIComponent(s.id)) route();
    else location.hash = encodeURIComponent(s.id);
  }

  window.addEventListener('hashchange', function () { state.transpose = 0; route(); });
  q.addEventListener('input', function () {
    if (location.hash) location.hash = ''; else showList();
  });
  document.getElementById('rand').onclick = function () { randomSong(); };
  document.getElementById('home').onclick = function () { q.value = ''; location.hash = ''; showList(); };
  document.getElementById('theme').onclick = function () {
    var el = document.documentElement;
    var dark = el.getAttribute('data-theme') === 'dark' ||
      (!el.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    el.setAttribute('data-theme', next);
    store('theme', next);
  };
  document.getElementById('foot').textContent = SONGS.length + ' canciones';
  route();
})();
</script>
</body>
</html>
