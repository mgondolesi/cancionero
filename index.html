<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Cancionero</title>
<style>
  :root {
    --bg: #f6f1e7; --surface: #fffdf8; --surface-2: #f0e9da;
    --ink: #231f1a; --muted: #7a7266; --line: #e4dccb;
    --accent: #c2501f; --accent-ink: #ffffff; --chord: #b4421a;
    --av-bg-s: 48%; --av-bg-l: 88%; --av-fg-s: 55%; --av-fg-l: 28%;
    --shadow: 0 1px 2px rgba(60,40,10,.06), 0 6px 20px rgba(60,40,10,.07);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13110e; --surface: #1c1915; --surface-2: #26221c;
      --ink: #f0eadf; --muted: #a2988a; --line: #2f2a22;
      --accent: #f0925f; --accent-ink: #1a0e06; --chord: #f5a678;
      --av-bg-s: 32%; --av-bg-l: 24%; --av-fg-s: 70%; --av-fg-l: 82%;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #13110e; --surface: #1c1915; --surface-2: #26221c;
    --ink: #f0eadf; --muted: #a2988a; --line: #2f2a22;
    --accent: #f0925f; --accent-ink: #1a0e06; --chord: #f5a678;
    --av-bg-s: 32%; --av-bg-l: 24%; --av-fg-s: 70%; --av-fg-l: 82%;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: auto; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 var(--sans); -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- barra superior ---------- */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .top-in {
    max-width: 880px; margin: 0 auto; height: 56px; padding: 0 12px 0 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .brand { font: 700 20px/1 var(--serif); letter-spacing: .2px; flex: 1; cursor: pointer; background: none; border: 0; text-align: left; padding: 0; }
  .brand span { color: var(--accent); }
  .back {
    display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
    background: none; border: 0; padding: 8px 8px 8px 0; font-weight: 600; color: var(--ink);
  }
  .back .arrow { font-size: 26px; line-height: 1; color: var(--accent); }
  .back .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back[hidden], .brand[hidden] { display: none; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); display: grid; place-items: center; font-size: 17px;
  }
  .icon-btn:hover { border-color: var(--accent); }

  main { max-width: 880px; margin: 0 auto; padding: 20px 16px 48px; }
  .enter { animation: enter .22s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .enter { animation: none; } }

  /* ---------- botones ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 600;
    border: 1px solid var(--line); background: var(--surface);
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }

  /* ---------- avatar ---------- */
  .av {
    flex: none; display: grid; place-items: center; border-radius: 50%;
    width: var(--s, 48px); height: var(--s, 48px);
    font: 700 calc(var(--s, 48px) * .36)/1 var(--serif); letter-spacing: .5px;
    background: hsl(var(--h) var(--av-bg-s) var(--av-bg-l));
    color: hsl(var(--h) var(--av-fg-s) var(--av-fg-l));
  }

  .av.logo { background: #fff; border: 1px solid var(--line); overflow: hidden; padding: calc(var(--s, 48px) * .06); }
  .av.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .av.logo.photo { padding: 0; }
  .av.logo.photo img { object-fit: cover; }

  /* ---------- inicio ---------- */
  .hero { padding: 8px 0 20px; }
  .hero h1 { font: 700 clamp(30px, 7vw, 44px)/1.08 var(--serif); margin: 0 0 6px; letter-spacing: -.3px; }
  .hero h1 em { font-style: italic; color: var(--accent); }
  .hero p { margin: 0 0 18px; color: var(--muted); }
  .search-row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
  .search { flex: 1 1 260px; position: relative; min-width: 0; display: block; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 48px; padding: 0 44px 0 42px; font: inherit; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: var(--shadow); -webkit-appearance: none; appearance: none;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-color: var(--accent); }
  .search .clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; color: var(--muted); font-size: 20px;
  }
  .search .clear[hidden] { display: none; }

  .sec-title {
    display: flex; align-items: baseline; justify-content: space-between;
    font: 700 13px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin: 26px 0 12px;
  }
  .sec-title .n { font-weight: 500; letter-spacing: 0; text-transform: none; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 800px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 14px; text-align: left;
    padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line);
    box-shadow: var(--shadow); min-width: 0; transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card:active { transform: scale(.98); }
  .card .nm { font: 700 17px/1.2 var(--serif); overflow-wrap: anywhere; }
  .card .ct { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .letter { font: 700 22px/1 var(--serif); color: var(--accent); margin: 24px 0 10px; }

  /* ---------- listas de canciones ---------- */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
    padding: 14px 16px; border-radius: 16px; background: var(--surface);
    border: 1px solid var(--line); min-height: 60px;
    transition: border-color .12s ease, transform .12s ease;
  }
  .row:hover { border-color: var(--accent); }
  .row:active { transform: scale(.99); }
  .row .tx { flex: 1; min-width: 0; }
  .row .t { font: 700 17px/1.25 var(--serif); }
  .row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .row .chev { color: var(--muted); font-size: 22px; }
  .pill {
    flex: none; font: 700 13px/1 var(--sans); padding: 6px 10px; border-radius: 999px;
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
  }
  .tag { font: 600 12px var(--sans); color: var(--accent); margin-left: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  .empty b { display: block; font: 700 20px var(--serif); color: var(--ink); margin-bottom: 6px; }

  /* ---------- artista ---------- */
  .a-hero { display: flex; align-items: center; gap: 18px; padding: 6px 0 4px; flex-wrap: wrap; }
  .a-hero .info { flex: 1; min-width: 180px; }
  .a-hero h1 { font: 700 clamp(28px, 6.5vw, 40px)/1.1 var(--serif); margin: 0; letter-spacing: -.2px; }
  .a-hero .sub { color: var(--muted); margin-top: 4px; }

  /* ---------- canción ---------- */
  .s-head h1 { font: 700 clamp(28px, 6.5vw, 40px)/1.1 var(--serif); margin: 4px 0 6px; letter-spacing: -.2px; }
  .s-head .by { color: var(--muted); }
  .link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .tools {
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    margin: 16px 0; padding: 12px 14px; border-radius: 18px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .grp { display: flex; align-items: center; gap: 6px; }
  .grp .lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
  .grp .val { min-width: 3.4em; text-align: center; font: 700 18px var(--serif); color: var(--accent); }
  .step {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--bg); font-size: 18px; line-height: 1;
  }
  .step:hover { border-color: var(--accent); }
  .tools .more { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  pre {
    margin: 0 0 110px; padding: 18px 16px; overflow-x: auto; background: var(--surface);
    border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
    font: var(--fs, 15px)/1.4 var(--mono); tab-size: 4;
  }
  pre .c { color: var(--chord); font-weight: 700; }
  pre .s { color: var(--muted); font-weight: 700; }

  /* ---------- deslizador ---------- */
  #as {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 12;
    bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 6px; padding: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 8px 30px rgba(0,0,0,.28);
  }
  #as .play {
    width: 48px; height: 48px; border-radius: 50%; border: 0; font-size: 16px;
    background: var(--accent); color: var(--accent-ink);
  }
  #as .lv { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 76px; }
  #as .lv small { font-size: 12px; color: var(--muted); font-weight: 600; }
  #as .dots { display: flex; gap: 4px; }
  #as .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  #as .dots i.on { background: var(--accent); }

  /* ---------- acordes tocables + ventana de diagramas ---------- */
  pre .ch { cursor: pointer; border-radius: 3px; }
  pre .ch:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .cd { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .cd[hidden] { display: none; }
  .cd-bg { position: absolute; inset: 0; background: rgba(0,0,0,.5); animation: fade .15s ease-out; }
  .cd-box {
    position: relative; width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 22px 22px 0 0;
    padding: 18px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0,0,0,.35);
    animation: up .2s ease-out;
  }
  @media (min-width: 700px) { .cd { align-items: center; } .cd-box { border-radius: 22px; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .cd-bg, .cd-box { animation: none; } }
  .cd-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .cd-head h2 { margin: 0; font: 700 34px/1 var(--serif); color: var(--accent); }
  .cd-x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; }
  .cd-notes { color: var(--muted); margin: 6px 0 14px; font-size: 14px; }
  .cd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
  .cd-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 6px 12px; text-align: center; }
  .cd-card svg { width: 100%; max-width: 112px; height: auto; display: block; margin: 0 auto; }
  .cd-card .cap { font-size: 12px; line-height: 1.3; margin-top: 4px; padding: 0 4px; }
  .cd-card .cap b { display: block; font-size: 13px; }
  .cd-card .cap span { color: var(--muted); }
  .cd-card .fr { font: 600 12px var(--mono); color: var(--accent); margin-top: 2px; }
  .cd-foot { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
  .g-line { stroke: var(--muted); stroke-width: 1; }
  .g-nut { stroke: var(--ink); stroke-width: 3.5; }
  .g-dot { fill: var(--accent); }
  .g-open { fill: none; stroke: var(--ink); stroke-width: 1.4; }
  .g-x { stroke: var(--ink); stroke-width: 1.4; }
  .g-txt { fill: var(--muted); font: 600 10px var(--sans); }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 32px; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand" id="brand" aria-label="Ir al inicio">Can<span>cion</span>ero</button>
    <button class="back" id="back" hidden><span class="arrow" aria-hidden="true">‹</span><span class="lbl" id="back-lbl"></span></button>
    <button class="icon-btn" id="theme" title="Cambiar tema (claro / oscuro)" aria-label="Cambiar tema"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  </div>
</header>
<main id="app"></main>
<footer id="foot"></footer>

<div class="cd" id="cd" hidden>
  <div class="cd-bg" id="cd-bg"></div>
  <div class="cd-box" role="dialog" aria-modal="true" aria-labelledby="cd-t">
    <div class="cd-head"><h2 id="cd-t"></h2><button class="cd-x" id="cd-x" aria-label="Cerrar">×</button></div>
    <div class="cd-notes" id="cd-notes"></div>
    <div class="cd-grid" id="cd-grid"></div>
    <p class="cd-foot">Cuerdas de la 6ª (grave, a la izquierda) a la 1ª (aguda). ○ = al aire, × = no se toca.</p>
  </div>
</div>

      if (!CHORDTOK.test(tok)) return esc(tok);
      return tok.replace(CHORDG, function (m, root, qual, bass) {
        return '<span class="ch" data-c="' + esc(root + qual + (bass ? '/' + bass : '')) + '">' + esc(m) + '</span>';
      });
    }).join('');
  }
  function renderBody(body, by) {
    return body.split('\n').map(function (line) {
      if (isChordLine(line)) {
        return '<span class="c">' + chordLineHtml(by ? transposeLine(line, by) : line) + '</span>';
      }
      if (/^\s*(ESTRIBILLO|VERSO|PUENTE|INTRO|SOLO|CORO)\b/.test(line)) {
        return '<span class="s">' + esc(line) + '</span>';
      }
      return esc(line);
    }).join('\n');
  }
  function fmtKey(k, by) {
    if (!k) return '';
    var m = /^([A-G][#b]?)(.*)$/.exec(k);
    return m ? shiftNote(m[1], by) + m[2] : k;
  }
  function norm(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  /* ---------- diagramas de acordes ---------- */
  // Frets de la cuerda 6 (grave) a la 1 (aguda). -1 = no se toca, 0 = al aire.
  var OPEN = {
    'C': [['x32010']], 'C7': [['x32310']], 'Cmaj7': [['x32000']],
    'D': [['xx0232']], 'Dm': [['xx0231']], 'D7': [['xx0212']], 'Dmaj7': [['xx0222']], 'Dm7': [['xx0211']],
    'Dsus4': [['xx0233']], 'Dsus2': [['xx0230']],
    'E': [['022100']], 'Em': [['022000']], 'E7': [['020100']], 'Em7': [['022030'], ['020000']],
    'Emaj7': [['021100']], 'Esus4': [['022200']],
    'F': [['xx3211', 'versión simple']], 'Fmaj7': [['xx3210']],
    'G': [['320003'], ['320033']], 'G7': [['320001']], 'Gmaj7': [['320002']],
    'A': [['x02220']], 'Am': [['x02210']], 'A7': [['x02020']], 'Am7': [['x02010']], 'Amaj7': [['x02120']],
    'Asus4': [['x02230']], 'Asus2': [['x02200']],
    'B7': [['x21202']], 'Bm7': [['x20202']]
  };
  // Formas móviles (con cejilla), en trastes relativos a la cejilla.
  var SHAPES_E = {   // raíz en la 6ª cuerda
    '': [0,2,2,1,0,0], 'm': [0,2,2,0,0,0], '7': [0,2,0,1,0,0], 'm7': [0,2,0,0,0,0],
    'maj7': [0,2,1,1,0,0], 'sus4': [0,2,2,2,0,0], '5': [0,2,2,-1,-1,-1]
  };
  var SHAPES_A = {   // raíz en la 5ª cuerda
    '': [-1,0,2,2,2,0], 'm': [-1,0,2,2,1,0], '7': [-1,0,2,0,2,0], 'm7': [-1,0,2,0,1,0],
    'maj7': [-1,0,2,1,2,0], 'sus4': [-1,0,2,2,3,0], 'sus2': [-1,0,2,2,0,0], 'dim': [-1,0,1,2,1,-1],
    '5': [-1,0,2,2,-1,-1]
  };
  var QUAL_ALIAS = { 'maj': '', 'min': 'm', 'sus': 'sus4', 'M7': 'maj7' };
  var INTERVALS = {
    '': [0,4,7], 'm': [0,3,7], '7': [0,4,7,10], 'm7': [0,3,7,10], 'maj7': [0,4,7,11],
    'sus4': [0,5,7], 'sus2': [0,2,7], 'dim': [0,3,6], 'aug': [0,4,8], '5': [0,7],
    '6': [0,4,7,9], 'm6': [0,3,7,9], '9': [0,4,7,10,2], 'add9': [0,4,7,2], 'm9': [0,3,7,10,2], 'dim7': [0,3,6,9]
  };
  var NOTE_ES = { 'C': 'Do', 'D': 'Re', 'E': 'Mi', 'F': 'Fa', 'G': 'Sol', 'A': 'La', 'B': 'Si' };

  function parseChord(name) {
    var m = /^([A-G][#b]?)(.*?)(?:\/([A-G][#b]?))?$/.exec(name);
    if (!m) return null;
    var q = m[2] in QUAL_ALIAS ? QUAL_ALIAS[m[2]] : m[2];
    return { root: m[1], qual: q, bass: m[3] || '' };
  }
  function fromStr(str) {
    return str.split('').map(function (c) { return c === 'x' ? -1 : parseInt(c, 10); });
  }
  function dedupe(list) {
    var seen = {};
    return list.filter(function (v) { var k = v.frets.join(','); return seen[k] ? false : (seen[k] = true); });
  }
  function variants(ch) {
    var out = [], root = idx(ch.root);
    if (root < 0) return out;
    var natural = ch.root.length === 1 ? ch.root : '';
    var key = natural + ch.qual;
    (OPEN[key] || []).forEach(function (o, i) {
      out.push({ title: i === 0 ? 'Común (abierto)' : 'Otra forma abierta', sub: o[1] || '', frets: fromStr(o[0]) });
    });
    [['E', SHAPES_E, 4, 'Mi', 6], ['A', SHAPES_A, 9, 'La', 5]].forEach(function (f) {
      var shape = f[1][ch.qual];
      if (!shape) return;
      var fret = ((root - f[2]) % 12 + 12) % 12;
      if (fret === 0) return;                          // sería el acorde abierto
      var frets = shape.map(function (x) { return x < 0 ? -1 : x + fret; });
      var first = f[4] === 6 ? 0 : 1;
      out.push({
        title: 'Con cejilla', sub: 'forma de ' + f[3] + ' · traste ' + fret, frets: frets,
        barre: { fret: fret, from: first, to: 5 }
      });
    });
    return dedupe(out);
  }
  function chordNotes(ch) {
    var iv = INTERVALS[ch.qual];
    if (!iv) return '';
    var r = idx(ch.root), scale = ch.root.indexOf('b') > 0 ? FLAT : SHARP;
    return iv.map(function (i) { return scale[(r + i) % 12]; }).join(' · ');
  }
  function diagram(v) {
    var X0 = 22, GAP = 14, Y0 = 28, FG = 18;
    var pressed = v.frets.filter(function (f) { return f > 0; });
    var maxF = Math.max.apply(null, pressed.concat([0])), minF = Math.min.apply(null, pressed.concat([99]));
    var base = maxF <= 5 ? 1 : minF;
    var g = '';
    for (var i = 0; i < 6; i++) g += '<line class="g-line" x1="' + (X0 + i * GAP) + '" y1="' + Y0 + '" x2="' + (X0 + i * GAP) + '" y2="' + (Y0 + 5 * FG) + '"/>';
    for (var k = 0; k <= 5; k++) {
      g += '<line class="' + (k === 0 && base === 1 ? 'g-nut' : 'g-line') + '" x1="' + X0 + '" y1="' + (Y0 + k * FG) + '" x2="' + (X0 + 5 * GAP) + '" y2="' + (Y0 + k * FG) + '"/>';
    }
    if (base > 1) g += '<text class="g-txt" x="2" y="' + (Y0 + FG * 0.7) + '">' + base + 'ª</text>';
    if (v.barre) {
      var by = Y0 + (v.barre.fret - base + 0.5) * FG;
      g += '<rect class="g-dot" x="' + (X0 + v.barre.from * GAP - 6) + '" y="' + (by - 6) + '" width="' + ((v.barre.to - v.barre.from) * GAP + 12) + '" height="12" rx="6"/>';
    }
    v.frets.forEach(function (f, i) {
      var cx = X0 + i * GAP;
      if (f < 0) g += '<path class="g-x" d="M' + (cx - 4) + ' ' + (Y0 - 14) + 'l8 8m0 -8l-8 8"/>';
      else if (f === 0) g += '<circle class="g-open" cx="' + cx + '" cy="' + (Y0 - 10) + '" r="4"/>';
      else if (!v.barre || f !== v.barre.fret || i < v.barre.from) g += '<circle class="g-dot" cx="' + cx + '" cy="' + (Y0 + (f - base + 0.5) * FG) + '" r="6"/>';
    });
    return '<svg viewBox="0 0 112 128" role="img" aria-label="Diagrama del acorde">' + g + '</svg>';
  }
  function openChord(name) {
    var ch = parseChord(name);
    if (!ch) return;
    scStop();
    var vs = variants(ch);
    document.getElementById('cd-t').textContent = name;
    var notes = chordNotes(ch);
    var rootEs = NOTE_ES[ch.root.charAt(0)] + ch.root.slice(1);
    document.getElementById('cd-notes').textContent = (notes ? 'Notas: ' + notes + ' · ' : '') + 'en cifrado latino: ' + rootEs + (ch.qual || '') +
      (ch.bass ? ' (con ' + ch.bass + ' en el bajo)' : '');
    document.getElementById('cd-grid').innerHTML = vs.length ? vs.map(function (v) {
      var fr = v.frets.map(function (f) { return f < 0 ? 'x' : f; }).join(' ');
      return '<div class="cd-card">' + diagram(v) + '<div class="cap"><b>' + esc(v.title) + '</b>' +
        (v.sub ? '<span>' + esc(v.sub) + '</span>' : '') + '</div><div class="fr">' + esc(fr) + '</div></div>';
    }).join('') : '<p class="cd-notes">Todavía no tengo diagramas para este acorde.</p>';
    var box = document.getElementById('cd');
    box.hidden = false;
    document.getElementById('cd-x').focus();
  }
  function closeChord() { document.getElementById('cd').hidden = true; }

  /* ---------- datos ---------- */
  var NO_ARTIST = 'Sin artista';
  function artistOf(s) { return s.artist || NO_ARTIST; }
  function sortKey(name) { return norm(name).replace(/^(los|las|la|el)\s+/, ''); }
  function buildArtists() {
    var map = {};
    SONGS.forEach(function (s) {
      var a = artistOf(s);
      (map[a] = map[a] || []).push(s);
    });
    return Object.keys(map).map(function (name) {
      return { name: name, songs: map[name].sort(function (x, y) { return norm(x.title) < norm(y.title) ? -1 : 1; }) };
    }).sort(function (a, b) { return sortKey(a.name) < sortKey(b.name) ? -1 : 1; });
  }
  var ARTISTS = buildArtists();
  function findArtist(name) { return ARTISTS.filter(function (a) { return a.name === name; })[0]; }
  function findSong(id) { return SONGS.filter(function (s) { return s.id === id; })[0]; }

  function hue(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return h;
  }
  function initials(name) {
    var w = name.split(/\s+/).filter(function (x) { return !/^(los|las|la|el|un|una)$/i.test(x); });
    if (!w.length) w = name.split(/\s+/);
    var out = w[0].charAt(0);
    if (w.length > 1) out += w[1].charAt(0);
    return out.toUpperCase();
  }
  function avatar(name, size) {
    var st = 'style="--h:' + hue(name) + ';--s:' + size + 'px"';
    if (LOGOS[name]) return '<span class="av logo' + (/^data:image\/jpeg/.test(LOGOS[name]) ? ' photo' : '') + '" ' + st + ' aria-hidden="true"><img src="' + LOGOS[name] + '" alt=""></span>';
    return '<span class="av" ' + st + ' aria-hidden="true">' + esc(initials(name)) + '</span>';
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  /* ---------- deslizamiento automático ---------- */
  var SPEEDS = [0, 8, 16, 28, 44, 64];            // px/seg por nivel (1-5)
  var sc = { on: false, level: 2, raf: 0, last: 0, pos: 0 };
  sc.level = parseInt(store('lvl'), 10) || 2;
  function barUpdate() {
    var el = document.getElementById('as');
    if (!el) return;
    el.querySelector('[data-p]').textContent = sc.on ? '❚❚' : '▶';
    el.querySelector('[data-p]').setAttribute('aria-label', sc.on ? 'Pausar' : 'Reproducir deslizamiento');
    el.querySelector('small').textContent = 'Nivel ' + sc.level;
    el.querySelectorAll('.dots i').forEach(function (d, i) { d.className = i < sc.level ? 'on' : ''; });
  }
  // Posición propia (con decimales): en el celu scrollBy redondea y los avances chicos se perdían.
  function scLoop(t) {
    if (!sc.on) return;
    if (!sc.last) sc.last = t;
    var dt = Math.min(t - sc.last, 100) / 1000;
    sc.last = t;
    sc.pos += SPEEDS[sc.level] * dt;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    if (sc.pos >= max) { window.scrollTo(0, max); scStop(); return; }   // llegó al final
    window.scrollTo(0, sc.pos);
    sc.raf = requestAnimationFrame(scLoop);
  }
  function scStart() {
    if (sc.on) return;
    sc.on = true; sc.last = 0; sc.pos = window.scrollY;
    sc.raf = requestAnimationFrame(scLoop);
    barUpdate();
  }
  function scStop() {
    sc.on = false;
    cancelAnimationFrame(sc.raf);
    barUpdate();
  }
  // Se frena si el usuario desliza a mano. Un toque (con temblor de dedo) no cuenta.
  var touchY = 0;
  window.addEventListener('wheel', function () { if (sc.on) scStop(); }, { passive: true });
  window.addEventListener('touchstart', function (e) { touchY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (sc.on && Math.abs(e.touches[0].clientY - touchY) > 12) scStop();
  }, { passive: true });

  /* ---------- vistas ---------- */
  function artistCard(a) {
    return '<button class="card" data-artist="' + esc(a.name) + '">' + avatar(a.name, 48) +
      '<span><span class="nm">' + esc(a.name) + '</span><div class="ct">' + plural(a.songs.length, 'canción', 'canciones') + '</div></span></button>';
  }
  function songRow(s, showArtist, tag) {
    return '<button class="row" data-song="' + esc(s.id) + '">' +
      (showArtist ? avatar(artistOf(s), 40) : '') +
      '<span class="tx"><div class="t">' + esc(s.title) + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') + '</div>' +
      (showArtist ? '<div class="s">' + esc(artistOf(s)) + '</div>' : '') + '</span>' +
      (s.key ? '<span class="pill">' + esc(s.key) + '</span>' : '') +
      '<span class="chev" aria-hidden="true">›</span></button>';
  }
  function bindNav(root) {
    root.querySelectorAll('[data-artist]').forEach(function (b) {
      b.onclick = function () { goArtist(b.getAttribute('data-artist')); };
    });
    root.querySelectorAll('[data-song]').forEach(function (b) {
      b.onclick = function () { goSong(b.getAttribute('data-song')); };
    });
  }

  function viewHome() {
    app.innerHTML =
      '<section class="hero"><h1>Tu <em>cancionero</em></h1>' +
      '<p>' + plural(SONGS.length, 'canción', 'canciones') + ' de ' + plural(ARTISTS.length, 'artista', 'artistas') + '. Elegí uno para ver sus temas.</p>' +
      '<div class="search-row"><label class="search">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
        '<input id="q" type="search" placeholder="Buscar artista, canción o letra…" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(state.q) + '">' +
        '<button class="clear" id="qclear" aria-label="Borrar búsqueda" hidden>×</button></label>' +
      '<button class="btn primary" id="rand">🎲 Tema al azar</button></div></section>' +
      '<div id="res"></div>';
    var q = document.getElementById('q');
    q.oninput = function () { state.q = q.value; homeResults(); };
    document.getElementById('qclear').onclick = function () { q.value = ''; state.q = ''; homeResults(); q.focus(); };
    document.getElementById('rand').onclick = function () { randomSong(); };
    homeResults();
  }
  function homeResults() {
    var res = document.getElementById('res');
    var t = norm(state.q.trim());
    document.getElementById('qclear').hidden = !state.q;
    var html = '';
    if (!t) {
      html += '<div class="sec-title">Artistas <span class="n">' + ARTISTS.length + '</span></div>';
      var group = ARTISTS.length > 24, last = '';
      if (!group) html += '<div class="grid">' + ARTISTS.map(artistCard).join('') + '</div>';
      else {
        ARTISTS.forEach(function (a) {
          var l = sortKey(a.name).charAt(0).toUpperCase();
          if (!/[A-Z]/.test(l)) l = '#';
          if (l !== last) {
            if (last) html += '</div>';
            html += '<div class="letter">' + l + '</div><div class="grid">';
            last = l;
          }
          html += artistCard(a);
        });
        html += '</div>';
      }
    } else {
      var as = ARTISTS.filter(function (a) { return norm(a.name).indexOf(t) >= 0; });
      var byMeta = [], byBody = [];
      SONGS.forEach(function (s) {
        if (norm(s.title + ' ' + artistOf(s)).indexOf(t) >= 0) byMeta.push(s);
        else if (norm(s.body).indexOf(t) >= 0) byBody.push(s);
      });
      if (as.length) html += '<div class="sec-title">Artistas <span class="n">' + as.length + '</span></div><div class="grid">' + as.map(artistCard).join('') + '</div>';
      if (byMeta.length || byBody.length) {
        html += '<div class="sec-title">Canciones <span class="n">' + (byMeta.length + byBody.length) + '</span></div><div class="list">' +
          byMeta.map(function (s) { return songRow(s, true); }).join('') +
          byBody.map(function (s) { return songRow(s, true, 'en la letra'); }).join('') + '</div>';
      }
      if (!as.length && !byMeta.length && !byBody.length) {
        html = '<div class="empty"><b>No encontré nada</b>Probá con otro nombre o parte de la letra.</div>';
      }
    }
    res.innerHTML = html;
    bindNav(res);
  }

  function viewArtist() {
    var a = findArtist(state.artist);
    if (!a) return goHome();
    app.innerHTML =
      '<section class="a-hero">' + avatar(a.name, 76) +
      '<div class="info"><h1>' + esc(a.name) + '</h1><div class="sub">' + plural(a.songs.length, 'canción', 'canciones') + '</div></div>' +
      '<button class="btn primary" id="rand">🎲 Al azar</button></section>' +
      '<div class="sec-title">Canciones <span class="n">' + a.songs.length + '</span></div>' +
      '<div class="list">' + a.songs.map(function (s) { return songRow(s, false); }).join('') + '</div>';
    document.getElementById('rand').onclick = function () { randomSong(a.name); };
    bindNav(app);
  }

  function songHtml(s) {
    var by = state.transpose;
    var a = artistOf(s);
    var sibs = (findArtist(a) || { songs: [] }).songs.length > 1;
    return '<div class="s-head"><h1>' + esc(s.title) + '</h1>' +
      '<div class="by">de <button class="link" id="alink">' + esc(a) + '</button></div></div>' +
      '<div class="tools">' +
        '<div class="grp"><span class="lbl">Tono</span>' +
          '<button class="step" data-t="-1" aria-label="Bajar un semitono">−</button>' +
          '<span class="val">' + esc(fmtKey(s.key, by) || (by > 0 ? '+' + by : String(by))) + '</span>' +
          '<button class="step" data-t="1" aria-label="Subir un semitono">+</button>' +
          (by ? '<button class="step" data-t="0" title="Volver al tono original" aria-label="Restablecer tono">↺</button>' : '') + '</div>' +
        '<div class="grp"><span class="lbl">Letra</span>' +
          '<button class="step" data-f="-1" aria-label="Letra más chica">A−</button>' +
          '<button class="step" data-f="1" aria-label="Letra más grande">A+</button></div>' +
        '<div class="more">' + (sibs ? '<button class="btn sm" id="again-a">Otra de ' + esc(a) + '</button>' : '') +
          '<button class="btn sm" id="again">🎲 Al azar</button></div>' +
      '</div>' +
      '<pre style="--fs:' + state.fs + 'px">' + renderBody(s.body, by) + '</pre>' +
      '<div id="as"><button class="play" data-p></button>' +
        '<button class="step" data-l="-1" aria-label="Más lento">−</button>' +
        '<div class="lv"><div class="dots"><i></i><i></i><i></i><i></i><i></i></div><small></small></div>' +
        '<button class="step" data-l="1" aria-label="Más rápido">+</button></div>';
  }
  function viewSong(keepScroll) {
    var s = findSong(state.song);
    if (!s) return goHome();
    var y = window.scrollY;
    app.innerHTML = songHtml(s);
    if (keepScroll) window.scrollTo(0, y);
    barUpdate();
    document.title = s.title + ' — Cancionero';
    document.getElementById('alink').onclick = function () { goArtist(artistOf(s)); };
    document.getElementById('again').onclick = function () { randomSong(null, s.id); };
    var aa = document.getElementById('again-a');
    if (aa) aa.onclick = function () { randomSong(artistOf(s), s.id); };
    var bar = document.getElementById('as');
    bar.querySelector('[data-p]').onclick = function () { sc.on ? scStop() : scStart(); };
    bar.querySelectorAll('[data-l]').forEach(function (b) {
      b.onclick = function () {
        sc.level = Math.min(5, Math.max(1, sc.level + parseInt(b.getAttribute('data-l'), 10)));
        store('lvl', String(sc.level));
        barUpdate();
      };
    });
    app.querySelectorAll('[data-t]').forEach(function (b) {
      b.onclick = function () {
        var v = parseInt(b.getAttribute('data-t'), 10);
        state.transpose = v === 0 ? 0 : state.transpose + v;
        viewSong(true);
      };
    });
    app.querySelectorAll('[data-f]').forEach(function (b) {
      b.onclick = function () {
        state.fs = Math.min(28, Math.max(10, state.fs + parseInt(b.getAttribute('data-f'), 10)));
        store('fs', String(state.fs));
        viewSong(true);
      };
    });
  }

  /* ---------- navegación ----------
     No depende del hash: al abrir el archivo desde WhatsApp u otras apps el hash
     puede no funcionar. El hash se usa solo como extra (botón atrás, links). */
  function topbar() {
    var back = document.getElementById('back'), brand = document.getElementById('brand');
    var home = state.view === 'home';
    back.hidden = home; brand.hidden = !home;
    if (state.view === 'artist') document.getElementById('back-lbl').textContent = 'Artistas';
    if (state.view === 'song') document.getElementById('back-lbl').textContent = artistOf(findSong(state.song) || {});
  }
  function render() {
    scStop();
    document.title = 'Cancionero';
    if (state.view === 'song') viewSong(false);
    else if (state.view === 'artist') viewArtist();
    else viewHome();
    topbar();
    app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter');
    window.scrollTo(0, 0);
  }
  function hashFor() {
    if (state.view === 'song') return '#s/' + encodeURIComponent(state.song);
    if (state.view === 'artist') return '#a/' + encodeURIComponent(state.artist);
    return '';
  }
  function setHash() {
    try { var h = hashFor(); if (location.hash !== h) location.hash = h; } catch (e) {}
  }
  function go(view, artist, song) {
    state.view = view; state.artist = artist || ''; state.song = song || ''; state.transpose = 0;
    render(); setHash();
  }
  function goHome() { go('home'); }
  function goArtist(name) { go('artist', name); }
  function goSong(id) { var s = findSong(id); if (s) go('song', artistOf(s), id); }
  function randomSong(artist, exceptId) {
    var pool = artist ? (findArtist(artist) || { songs: [] }).songs : SONGS;
    if (pool.length > 1 && exceptId) pool = pool.filter(function (s) { return s.id !== exceptId; });
    if (pool.length) goSong(pool[Math.floor(Math.random() * pool.length)].id);
  }
  function parseHash() {
    var h = '';
    try { h = decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) {}
    var m = /^([as])\/(.+)$/.exec(h);
    if (m && m[1] === 's' && findSong(m[2])) return { view: 'song', artist: artistOf(findSong(m[2])), song: m[2] };
    if (m && m[1] === 'a' && findArtist(m[2])) return { view: 'artist', artist: m[2], song: '' };
    return { view: 'home', artist: '', song: '' };
  }
  window.addEventListener('hashchange', function () {
    var p = parseHash();
    if (p.view !== state.view || p.artist !== state.artist || p.song !== state.song) {
      state.view = p.view; state.artist = p.artist; state.song = p.song; state.transpose = 0;
      render();
    }
  });

  app.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('.ch') : null;
    if (t) openChord(t.getAttribute('data-c'));
  });
  document.getElementById('cd-x').onclick = closeChord;
  document.getElementById('cd-bg').onclick = closeChord;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeChord(); });
  document.getElementById('brand').onclick = function () { state.q = ''; goHome(); };
  document.getElementById('back').onclick = function () {
    if (state.view === 'song') goArtist(state.artist); else goHome();
  };
  document.getElementById('theme').onclick = function () {
    var el = document.documentElement;
    var dark = el.getAttribute('data-theme') === 'dark' ||
      (!el.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    el.setAttribute('data-theme', next);
    store('theme', next);
  };
  document.getElementById('foot').textContent = plural(SONGS.length, 'canción', 'canciones') + ' · ' + plural(ARTISTS.length, 'artista', 'artistas');

  var p0 = parseHash();
  state.view = p0.view; state.artist = p0.artist; state.song = p0.song;
  render();
})();
</script>
</body>
</html>
