  :root {
    --bg: #f6f1e7; --surface: #fffdf8; --surface-2: #f0e9da;
    --ink: #231f1a; --muted: #7a7266; --line: #e4dccb;
    --accent: #c2501f; --accent-ink: #ffffff; --chord: #b4421a;
    --av-bg-s: 48%; --av-bg-l: 88%; --av-fg-s: 55%; --av-fg-l: 28%;
    --shadow: 0 1px 2px rgba(60,40,10,.06), 0 6px 20px rgba(60,40,10,.07);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --lyric: var(--sans);
    --mono: "Inconsolata", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13110e; --surface: #1c1915; --surface-2: #26221c;
      --ink: #f0eadf; --muted: #a2988a; --line: #2f2a22;
      --accent: #f0925f; --accent-ink: #1a0e06; --chord: #f5a678;
      --av-bg-s: 32%; --av-bg-l: 24%; --av-fg-s: 70%; --av-fg-l: 82%;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #13110e; --surface: #1c1915; --surface-2: #26221c;
    --ink: #f0eadf; --muted: #a2988a; --line: #2f2a22;
    --accent: #f0925f; --accent-ink: #1a0e06; --chord: #f5a678;
    --av-bg-s: 32%; --av-bg-l: 24%; --av-fg-s: 70%; --av-fg-l: 82%;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: auto; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 var(--sans); -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- barra superior ---------- */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .top-in {
    max-width: 880px; margin: 0 auto; height: 56px; padding: 0 12px 0 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .brand { font: 700 20px/1 var(--serif); letter-spacing: .2px; flex: 1; cursor: pointer; background: none; border: 0; text-align: left; padding: 0; }
  .brand span { color: var(--accent); }
  .back {
    display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
    background: none; border: 0; padding: 8px 8px 8px 0; font-weight: 600; color: var(--ink);
  }
  .back .arrow { font-size: 26px; line-height: 1; color: var(--accent); }
  .back .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back[hidden], .brand[hidden] { display: none; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); display: grid; place-items: center; font-size: 17px;
  }
  .icon-btn:hover { border-color: var(--accent); }

  .top-search { max-width: 880px; margin: 0 auto; padding: 0 12px 10px 16px; }
  .top-search .search { flex: none; width: 100%; }
  .top-search .search input { height: 40px; box-shadow: none; }
  .sres {
    position: absolute; left: 0; right: 0; top: 100%;
    max-height: calc(100vh - 130px); max-height: calc(100dvh - 130px); overflow-y: auto;
    background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 18px 30px rgba(0,0,0,.18);
  }
  .sres[hidden] { display: none; }
  .sres-in { max-width: 880px; margin: 0 auto; padding: 4px 16px 24px; }
  .sres .sec-title:first-child { margin-top: 14px; }
  .sres .empty { padding: 28px 0; }

  main { max-width: 880px; margin: 0 auto; padding: 20px 16px 48px; }
  .enter { animation: enter .22s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .enter { animation: none; } }

  /* ---------- botones ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 600;
    border: 1px solid var(--line); background: var(--surface);
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }

  /* ---------- avatar ---------- */
  .av {
    flex: none; display: grid; place-items: center; border-radius: 50%;
    width: var(--s, 48px); height: var(--s, 48px);
    font: 700 calc(var(--s, 48px) * .36)/1 var(--serif); letter-spacing: .5px;
    background: hsl(var(--h) var(--av-bg-s) var(--av-bg-l));
    color: hsl(var(--h) var(--av-fg-s) var(--av-fg-l));
  }

  .av.logo { background: #fff; border: 1px solid var(--line); overflow: hidden; padding: calc(var(--s, 48px) * .06); }
  .av.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .av.logo.photo { padding: 0; }
  .av.logo.photo img { object-fit: cover; }

  /* ---------- inicio ---------- */
  .hero { padding: 8px 0 20px; }
  .hero h1 { font: 700 clamp(30px, 7vw, 44px)/1.08 var(--serif); margin: 0 0 6px; letter-spacing: -.3px; }
  .hero h1 em { font-style: italic; color: var(--accent); }
  .hero p { margin: 0 0 18px; color: var(--muted); }
  .search-row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
  .search { flex: 1 1 260px; position: relative; min-width: 0; display: block; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 48px; padding: 0 80px 0 42px; font: inherit; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: var(--shadow); -webkit-appearance: none; appearance: none;
  }
  .search input::placeholder { color: var(--muted); }
  .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
  .search input:focus { outline: none; border-color: var(--accent); }
  .search .clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; color: var(--muted); font-size: 20px;
  }
  .search .clear[hidden] { display: none; }
  .search .clear { right: 42px; }
  .search .mic {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; color: var(--muted);
    display: grid; place-items: center; cursor: pointer;
  }
  .search .mic:hover { color: var(--accent); }
  .search .mic[hidden] { display: none; }
  .search .mic.on { color: #fff; background: #d93025; animation: micpulse 1.1s ease-in-out infinite; }
  @keyframes micpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(217,48,37,.45); } 50% { box-shadow: 0 0 0 8px rgba(217,48,37,0); } }
  @media (prefers-reduced-motion: reduce) { .search .mic.on { animation: none; } }

  .sec-title {
    display: flex; align-items: baseline; justify-content: space-between;
    font: 700 13px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin: 26px 0 12px;
  }
  .sec-title .n { font-weight: 500; letter-spacing: 0; text-transform: none; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 800px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 14px; text-align: left;
    padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line);
    box-shadow: var(--shadow); min-width: 0; transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card:active { transform: scale(.98); }
  .card .nm { font: 700 17px/1.2 var(--serif); overflow-wrap: anywhere; }
  .card .ct { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .letter { font: 700 22px/1 var(--serif); color: var(--accent); margin: 24px 0 10px; }

  /* ---------- listas de canciones ---------- */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
    padding: 14px 16px; border-radius: 16px; background: var(--surface);
    border: 1px solid var(--line); min-height: 60px;
    transition: border-color .12s ease, transform .12s ease;
  }
  .row:hover { border-color: var(--accent); }
  .row:active { transform: scale(.99); }
  .row .tx { flex: 1; min-width: 0; }
  .row .t { font: 700 17px/1.25 var(--serif); }
  .row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .row .chev { color: var(--muted); font-size: 22px; }
  .pill {
    flex: none; font: 700 13px/1 var(--sans); padding: 6px 10px; border-radius: 999px;
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
  }
  .tag { font: 600 12px var(--sans); color: var(--accent); margin-left: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  .empty b { display: block; font: 700 20px var(--serif); color: var(--ink); margin-bottom: 6px; }

  /* ---------- artista ---------- */
  .a-hero { display: flex; align-items: center; gap: 18px; padding: 6px 0 4px; flex-wrap: wrap; }
  .a-hero .info { flex: 1; min-width: 180px; }
  .a-hero h1 { font: 700 clamp(28px, 6.5vw, 40px)/1.1 var(--serif); margin: 0; letter-spacing: -.2px; }
  .a-hero .sub { color: var(--muted); margin-top: 4px; }

  /* ---------- canción ---------- */
  .s-head h1 { font: 700 clamp(28px, 6.5vw, 40px)/1.1 var(--serif); margin: 4px 0 6px; letter-spacing: -.2px; }
  .s-head .by { color: var(--muted); }
  .link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .tools {
    display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 10px 16px;
    margin: 14px 0; padding: 10px 14px 12px; border-radius: 18px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .grp { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .grp .lbl { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .ctl { display: flex; align-items: center; gap: 6px; }
  .grp .val { min-width: 3em; text-align: center; font: 700 18px var(--serif); color: var(--accent); }
  .step {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--bg); font-size: 17px; line-height: 1;
  }
  .step:hover { border-color: var(--accent); }
  .step.on { border-color: var(--accent); color: var(--accent); }

  /* hoja: los acordes van sobre la sílaba y la letra se parte en renglones */
  .sheet {
    margin: 0; padding: 18px 16px 20px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
    font: var(--fs, 17px)/1.4 var(--lyric); overflow-wrap: break-word;
  }
  .sheet .ln { margin: 0; }
  .sheet .ln.blank { height: .85em; }
  .sheet .t { padding: .1em 0; }
  .sheet .pair { padding-top: .15em; }
  .sheet .w { white-space: nowrap; }
  .sheet .seg { display: inline-block; vertical-align: baseline; }
  .sheet .cc { display: block; min-height: 1.3em; padding-right: .55em; font: 700 .9em/1.3 var(--mono); color: var(--chord); }
  .sheet .ll { display: block; white-space: pre; }
  .sheet .cl { font: 700 .92em/1.45 var(--mono); color: var(--chord); white-space: pre-wrap; padding: .1em 0; }
  .sheet .s { font: 700 .78em/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 1.1em 0 .25em; }
  .sheet .raw { margin: .3em 0; overflow-x: auto; font: .82em/1.3 var(--mono); color: var(--muted); tab-size: 4; }
  .next { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 110px; }

  /* ---------- deslizador ---------- */
  #as {
    position: fixed; z-index: 12; right: max(16px, env(safe-area-inset-right));
    bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 6px; padding: 5px;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.28);
  }
  #as:not(.open) { padding: 0; border: 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  #as:not(.open) .step, #as:not(.open) .lv { display: none; }
  #as .play {
    width: 52px; height: 52px; border-radius: 50%; border: 0; font-size: 16px;
    background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px rgba(0,0,0,.28);
  }
  #as.open .play { box-shadow: none; }
  #as .lv { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 70px; }
  #as .lv small { font-size: 12px; color: var(--muted); font-weight: 600; }
  #as .dots { display: flex; gap: 4px; }
  #as .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  #as .dots i.on { background: var(--accent); }

  /* ---------- acordes tocables + ventana de diagramas ---------- */
  .sheet .ch { cursor: pointer; border-radius: 3px; }
  .sheet .ch:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .cd { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .cd[hidden] { display: none; }
  .cd-bg { position: absolute; inset: 0; background: rgba(0,0,0,.5); animation: fade .15s ease-out; }
  .cd-box {
    position: relative; width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 22px 22px 0 0;
    padding: 18px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0,0,0,.35);
    animation: up .2s ease-out;
  }
  @media (min-width: 700px) { .cd { align-items: center; } .cd-box { border-radius: 22px; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .cd-bg, .cd-box { animation: none; } }
  .cd-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .cd-head h2 { margin: 0; font: 700 34px/1 var(--serif); color: var(--accent); }
  .cd-x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; }
  .cd-notes { color: var(--muted); margin: 6px 0 14px; font-size: 14px; }
  .cd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
  .cd-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 6px 12px; text-align: center; }
  .cd-card svg { width: 100%; max-width: 112px; height: auto; display: block; margin: 0 auto; }
  .cd-card .cap { font-size: 12px; line-height: 1.3; margin-top: 4px; padding: 0 4px; }
  .cd-card .cap b { display: block; font-size: 13px; }
  .cd-card .cap span { color: var(--muted); }
  .cd-card .fr { font: 600 12px var(--mono); color: var(--accent); margin-top: 2px; }
  .cd-foot { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
  .g-line { stroke: var(--muted); stroke-width: 1; }
  .g-nut { stroke: var(--ink); stroke-width: 3.5; }
  .g-dot { fill: var(--accent); }
  .g-open { fill: none; stroke: var(--ink); stroke-width: 1.4; }
  .g-x { stroke: var(--ink); stroke-width: 1.4; }
  .g-txt { fill: var(--muted); font: 600 10px var(--sans); }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 32px; }
</style>
</head>

ras\n\nRequinto:\nD - A - Bm - G - A  (x2)\n\nD                                 A\nQuiero llorar y me destroza que pienses asi\n                    Bm          G\ny mas que ahora me quede sin ti\n                    A\nme duele lo que tu vas a sufrir\n\nCORO:\n\nD                                 A\nPero recuerda nadie es perfecto y tu lo veras\n                   Bm               G\nmas de mil cosas mejores tendras\n               A\npero cariño sincero jamas\n\nD                                      A\nVete olvidando de esto que hoy dejas y que cambiaras\n                    Bm              G\npor la aventura que tu ya veras\n                  A\nsera tu carcel y nunca saldras (SE REPITE)\n\nRequinto final:\nD - A - Bm - G - A"}, {"id": "la-vela-puerca-va-a-escampar", "title": "Va a Escampar", "artist": "La Vela Puerca", "key": "F", "body": "Ritmo: Lo hace rápido: Ab - Ab - Ar - Ab - Ar - Ab - Ab - Ab - Ar\n\nAb = Abajo\nAr = Arriba\n\nIntro: (F Am) x2\n\nF                 Am              F           Am\nHoy asume lo que venga, sea para bien, o todo mal,\nF                        Am               F            Am\ny aunque pierda lo que tenga, se va a morder para aguantar.\nF                     Am                 F              Am\nHoy que claro ve las cosas, que ayer no vio, ni va a exigir,\nF                 Am                F          Am\nsobre su pena se posa, quiere entender para seguir.\n\nF                G                    C        G/B       F\nLlega la batalla, y contra el estalla, algún día va a escampar,\nF                   G                    C     G/B         F\ny como sale de ésta, quiere la respuesta, sabe que no es escampar.\n\nC      G              F  G         C          G          F  G\nSu paciencia va a montar, todo un circo para verlo desfilar;\nC     G            F  G          C           G             F  G\nal dolor que supo ser, y al que ahora ya no quiere ver volver.\n\nSolo acordes: (Am G F G) x2\n\nF        G          Am   G              F  G          Am  G\nHoy se siente satisfecho, aunque aquel rol, no exista más,\nF     G           Am   G          F  G           Am  G\npara vida con su pecho, y su canción, vuelve a sonar.\nF       G         Am    G          F  G           Am  G\nHoy recibe los aplausos, supo ser sal, y también miel,\nF    G             Am   G         F   G        Am  G\ny conecta con sus pasos, que resbalar, no cae bien.\n\nF                G                    C        G/B         F\nTerminó la guerra, los pies en la tierra, y su mano a un corazón\nF                  G                  C      G/B          F\nsu pensar tranquilo, su pena un olvido, y su alma, una pasión.\n\nF     G           Am   G          F   G       Am  G\nHoy asume lo que venga, sea para bien, o todo mal,\nF       G              Am   G             F   G         Am  G\ny aunque pierda lo que tenga, se va a morder, para aguantar.\n\nC      G              F  G         C          G          F  G\nSu paciencia va a montar, todo un circo para verlo desfilar;\nC     G            F  G          C           G             F  G\nal dolor que supo ser, y al que ahora ya no quiere ver volver.\nC     G            F  G               C             G             F  G\nSe refugia en un farol, y entre dos flores que siempre apuntan al sol.\nC     G         F  G       C           G             F  G\nAsí cruza su pared, me sonríe y rompe con su propia red.\n\nSolo acordes: (Am G F G) x2\n\nSolo Guitar: (F G Am G) x3 F G Am Am\n\nv = vibrato\nb = bend\ns = slide (en este caso Slide In desde abajo)\n\n1º---------------------|-------------------|-----------------------|\n2º-------12v-------13v-|-------13-12-------|-----------------------|\n3º---------------------|--------------14-12|-----------------------|\n4º----14--------14-----|----14-------------|--10---12b-12----14b-14|\n5º---------------------|-------------------|-----------------------|\n6º---------------------|-------------------|-----------------------|\n\n1º---------- ue ahora me dan miedo\nBm        Em              F#m               Bm\nayuné por causas al pedo, ya me empaché con pollo al spiedo\n\nBm               Em             F#m                Bm\nya fui al psicólogo, fui al teólogo, fui al astrólogo, fui al enólogo\nBm             Em                F#m              Bm\nya fui alcohólico y fui lambeta, ya fui anónimo y ya hice dieta\n\nBm           Em                 F#m              Bm\nya lancé piedras y escupitajos, al lugar donde ahora trabajo\nBm          Em                F#m                     Bm\ny mi legajo cuenta a destajo, que me porté bien y que armé relajo\n\n\nBm    G       A         G\ny oigo una voz que dice sin razón,\nD       Bm            A\nvos siempre cambiando ya no cambias más\nBm  G     A         G\ny yo estoy cada vez más igual,\nD     Bm              A  Bm\nya no sé que hacer conmigo\n\nBm    G       A         G\ny oigo una voz que dice sin razón,\nD       Bm            A\nvos siempre cambiando ya no cambias más\nBm  G     A         G\ny yo estoy cada vez más igual,\nD     Bm              A  Bm\nya no sé que hacer conmigo"}, {"id": "el-soldado-angel-de-los-perdedores", "title": "Ángel de los perdedores", "artist": "El Soldado", "key": "Am", "body": "(intro)\n\nAm            Am/G          D/F#        F\ne|------------|------------|------------|------------|\nB|------1-----|-------1----|-------1----|------3-----|\nG|--------2---|----2-------|----2-------|---2-----2--|\nD|----2-------|------------|-0----------|------------|\nA|-0----------|------------|------------|------------|\nE|------------|-3--------2-|---------2--|-1----------|\n\n(la 1º estrofa todo con intro hasta casi la segunda)\n\nAm       Am/G             D/F#      F           (Am Am/G D/F# F)\nApretando bien el paquete apuraste fuera ese vaso\nAm       Am/G             D/F#        F           (Am Am/G D/F# F)\nsaliste corriendo a la calle que te estaba llamando\nAm       Am/G             D/F#      F         (Am Am/G D/F# F)\n'la puta, qu     }
    inner.innerHTML = html;
    bindNav(inner);
    box.hidden = false;
    box.scrollTop = 0;
  }
  function clearSearch() {
    state.q = '';
    var q = document.getElementById('q');
    if (q) q.value = '';
    runSearch();
  }

  function viewArtist() {
    var a = findArtist(state.artist);
    if (!a) return goHome();
    app.innerHTML =
      '<section class="a-hero">' + avatar(a.name, 76) +
      '<div class="info"><h1>' + esc(a.name) + '</h1><div class="sub">' + plural(a.songs.length, 'canción', 'canciones') + '</div></div>' +
      (a.songs.length > 1 ? '<button class="btn primary" id="rand">🎲 Al azar</button>' : '') + '</section>' +
      '<div class="sec-title">Canciones <span class="n">' + a.songs.length + '</span></div>' +
      '<div class="list">' + a.songs.map(function (s) { return songRow(s, false); }).join('') + '</div>';
    var ra = document.getElementById('rand');
    if (ra) ra.onclick = function () { randomSong(a.name); };
    bindNav(app);
  }

  function songHtml(s) {
    var by = state.transpose;
    var a = artistOf(s);
    var sibs = (findArtist(a) || { songs: [] }).songs.length > 1;
    return '<div class="s-head"><h1>' + esc(s.title) + '</h1>' +
      '<div class="by">de <button class="link" id="alink">' + esc(a) + '</button></div></div>' +
      '<div class="tools">' +
        '<div class="grp"><span class="lbl">Tono</span><div class="ctl">' +
          '<button class="step" data-t="-1" aria-label="Bajar un semitono">−</button>' +
          '<span class="val">' + esc(fmtKey(s.key, by) || (by > 0 ? '+' + by : String(by))) + '</span>' +
          '<button class="step" data-t="1" aria-label="Subir un semitono">+</button>' +
          (by ? '<button class="step" data-t="0" title="Volver al tono original" aria-label="Restablecer tono">↺</button>' : '') + '</div></div>' +
        '<div class="grp"><span class="lbl">Letra</span><div class="ctl">' +
          '<button class="step" data-f="-1" aria-label="Letra más chica">A−</button>' +
          '<button class="step" data-f="1" aria-label="Letra más grande">A+</button></div></div>' +
      '</div>' +
      '<div class="sheet" style="--fs:' + state.fs + 'px">' + renderBody(s.body, by) + '</div>' +
      '<div class="next">' + (sibs ? '<button class="btn" id="again-a">Otra de ' + esc(a) + '</button>' : '') +
        '<button class="btn" id="again">🎲 Al azar</button></div>' +
      '<div id="as">' +
        '<button class="step" data-l="-1" aria-label="Más lento">−</button>' +
        '<div class="lv"><div class="dots"><i></i><i></i><i></i><i></i><i></i></div><small></small></div>' +
        '<button class="step" data-l="1" aria-label="Más rápido">+</button>' +
        '<button class="play" data-p></button></div>';
  }
  function viewSong(keepScroll) {
    var s = findSong(state.song);
    if (!s) return goHome();
    var y = window.scrollY;
    app.innerHTML = songHtml(s);
    if (keepScroll) window.scrollTo(0, y);
    barUpdate();
    document.title = s.title + ' — Cancionero';
    document.getElementById('alink').onclick = function () { goArtist(artistOf(s)); };
    document.getElementById('again').onclick = function () { randomSong(null, s.id); };
    var aa = document.getElementById('again-a');
    if (aa) aa.onclick = function () { randomSong(artistOf(s), s.id); };
    var bar = document.getElementById('as');
    bar.querySelector('[data-p]').onclick = function () { sc.on ? scStop() : scStart(); };
    bar.querySelectorAll('[data-l]').forEach(function (b) {
      b.onclick = function () {
        sc.level = Math.min(5, Math.max(1, sc.level + parseInt(b.getAttribute('data-l'), 10)));
        store('lvl', String(sc.level));
        barUpdate();
      };
    });
    app.querySelectorAll('[data-t]').forEach(function (b) {
      b.onclick = function () {
        var v = parseInt(b.getAttribute('data-t'), 10);
        state.transpose = v === 0 ? 0 : state.transpose + v;
        viewSong(true);
      };
    });
    app.querySelectorAll('[data-f]').forEach(function (b) {
      b.onclick = function () {
        state.fs = Math.min(28, Math.max(10, state.fs + parseInt(b.getAttribute('data-f'), 10)));
        store('fs', String(state.fs));
        viewSong(true);
      };
    });
  }

  /* ---------- navegación ----------
     No depende del hash: al abrir el archivo desde WhatsApp u otras apps el hash
     puede no funcionar. El hash se usa solo como extra (botón atrás, links). */
  function topbar() {
    var back = document.getElementById('back'), brand = document.getElementById('brand');
    var home = state.view === 'home';
    back.hidden = home; brand.hidden = !home;
    if (state.view === 'artist') document.getElementById('back-lbl').textContent = 'Artistas';
    if (state.view === 'song') document.getElementById('back-lbl').textContent = artistOf(findSong(state.song) || {});
  }
  function render() {
    scStop();
    clearSearch();
    document.title = 'Cancionero';
    if (state.view === 'song') viewSong(false);
    else if (state.view === 'artist') viewArtist();
    else viewHome();
    topbar();
    app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter');
    window.scrollTo(0, 0);
  }
  function hashFor() {
    if (state.view === 'song') return '#s/' + encodeURIComponent(state.song);
    if (state.view === 'artist') return '#a/' + encodeURIComponent(state.artist);
    return '';
  }
  function setHash() {
    try { var h = hashFor(); if (location.hash !== h) location.hash = h; } catch (e) {}
  }
  function go(view, artist, song) {
    state.view = view; state.artist = artist || ''; state.song = song || ''; state.transpose = 0;
    render(); setHash();
  }
  function goHome() { go('home'); }
  function goArtist(name) { go('artist', name); }
  function goSong(id) { var s = findSong(id); if (s) go('song', artistOf(s), id); }
  // Azar "de mazo": se sortea sin repetir hasta que salieron todas las canciones, y
  // recién ahí se vuelve a mezclar. Se guarda qué salió, así sigue aunque cierres la página.
  function randInt(n) {
    try {
      var a = new Uint32Array(1); crypto.getRandomValues(a);
      return Math.floor(a[0] / 4294967296 * n);
    } catch (e) { return Math.floor(Math.random() * n); }
  }
  function usedLoad(key) {
    try { var v = JSON.parse(store('used:' + key) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  function randomSong(artist, exceptId) {
    var pool = artist ? (findArtist(artist) || { songs: [] }).songs : SONGS;
    if (!pool.length) return;
    var key = artist || '*';
    var ids = pool.map(function (s) { return s.id; });
    var used = usedLoad(key).filter(function (id) { return ids.indexOf(id) >= 0; });
    var left = ids.filter(function (id) { return used.indexOf(id) < 0 && id !== exceptId; });
    if (!left.length) {                                   // salieron todas: nuevo mazo
      used = exceptId ? [exceptId] : [];
      left = ids.filter(function (id) { return used.indexOf(id) < 0; });
      if (!left.length) left = ids;                       // una sola canción
    }
    var pick = left[randInt(left.length)];
    used.push(pick);
    store('used:' + key, JSON.stringify(used));
    goSong(pick);
  }
  function parseHash() {
    var h = '';
    try { h = decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) {}
    var m = /^([as])\/(.+)$/.exec(h);
    if (m && m[1] === 's' && findSong(m[2])) return { view: 'song', artist: artistOf(findSong(m[2])), song: m[2] };
    if (m && m[1] === 'a' && findArtist(m[2])) return { view: 'artist', artist: m[2], song: '' };
    return { view: 'home', artist: '', song: '' };
  }
  window.addEventListener('hashchange', function () {
    var p = parseHash();
    if (p.view !== state.view || p.artist !== state.artist || p.song !== state.song) {
      state.view = p.view; state.artist = p.artist; state.song = p.song; state.transpose = 0;
      render();
    }
  });

  app.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('.ch') : null;
    if (t) openChord(t.getAttribute('data-c'));
  });
  document.getElementById('cd-x').onclick = closeChord;
  document.getElementById('cd-bg').onclick = closeChord;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeChord(); });
  (function () {
    var q = document.getElementById('q');
    var qTimer = 0;
    q.oninput = function () { state.q = q.value; clearTimeout(qTimer); qTimer = setTimeout(runSearch, 120); };
    q.onkeydown = function (e) {
      if (e.key === 'Enter') {
        var first = document.querySelector('#sres-in [data-song], #sres-in [data-artist]');
        if (first) { first.click(); q.blur(); }
      } else if (e.key === 'Escape') { clearSearch(); q.blur(); }
    };
    document.getElementById('qclear').onclick = function () { clearSearch(); q.focus(); };

    // Búsqueda por voz (Web Speech API; en Chrome, Edge y Safari)
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var mic = document.getElementById('qmic');
    if (SR) {
      mic.hidden = false;
      var rec = null, ph = q.placeholder;
      var stopUi = function () { mic.classList.remove('on'); q.placeholder = ph; rec = null; };
      mic.onclick = function () {
        if (rec) { try { rec.stop(); } catch (e) {} return; }
        rec = new SR();
        rec.lang = 'es-AR'; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
        rec.onstart = function () { mic.classList.add('on'); q.placeholder = 'Escuchando… decime qué buscás'; };
        rec.onresult = function (e) {
          var txt = '';
          for (var i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
          txt = txt.replace(/[.,!?¿¡]+$/g, '').trim();
          q.value = txt; state.q = txt; runSearch();
        };
        rec.onerror = function (e) {
          var msg = e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'Dale permiso al micrófono para buscar con la voz'
            : e.error === 'no-speech' ? 'No te escuché, probá de nuevo' : '';
          stopUi();
          if (msg) q.placeholder = msg, setTimeout(function () { if (!rec) q.placeholder = ph; }, 3500);
        };
        rec.onend = function () { if (rec) stopUi(); };
        try { rec.start(); } catch (e) { stopUi(); }
      };
    }
  })();
  document.getElementById('brand').onclick = function () { goHome(); };
  document.getElementById('back').onclick = function () {
    if (state.view === 'song') goArtist(state.artist); else goHome();
  };
  document.getElementById('theme').onclick = function () {
    var el = document.documentElement;
    var dark = el.getAttribute('data-theme') === 'dark' ||
      (!el.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    el.setAttribute('data-theme', next);
    store('theme', next);
  };
  document.getElementById('foot').textContent = plural(SONGS.length, 'canción', 'canciones') + ' · ' + plural(ARTISTS.length, 'artista', 'artistas');

  // Instalable / uso sin conexión (solo cuando se abre desde la web, no desde un archivo)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  var p0 = parseHash();
  state.view = p0.view; state.artist = p0.artist; state.song = p0.song;
  render();
})();
</script>
</body>
</html>
