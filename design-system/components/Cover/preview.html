<!-- @dsCard height=288 -->
<!--
blocks: accent 200x240 slab + ink 120x112 + chord 96x112 + surface-2 232x112 (merged two-wide), all on the 8px/16px steps, rx radius-lg 18.
arrangement: a tall slab with three satellites, staggered right of x=480, 24px gutters.
pattern: six guitar-string hairlines cut out of the blocks in the ground colour with three fret dots as discs; chosen because the system is a chord book: serif, hairline borders, warm paper.
steps and radii: space-24, space-16, radius-lg, radius-round.
-->
<style>
body{margin:0;padding:0}
svg{display:block;width:960px;height:288px}
.ground{fill:var(--bg)} .a{fill:var(--accent);rx:var(--radius-lg)} .i{fill:var(--ink);rx:var(--radius-lg)}
.c{fill:var(--chord);rx:var(--radius-lg)} .t{fill:var(--surface-2);rx:var(--radius-lg)}
.str{stroke:var(--bg);stroke-width:1.5} .dot{fill:var(--bg)}
.nm{font:700 80px/1 var(--font-serif);fill:var(--ink);letter-spacing:-.3px}
.tg{font:400 14px var(--font-sans);fill:var(--muted)}
</style>
<svg viewBox="0 0 960 288" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cancionero">

<rect class="i" x="696" y="24" width="120" height="112"/>

<g>
<line class="str" x1="480" x2="928" y1="52" y2="52"/><line class="str" x1="480" x2="928" y1="92" y2="92"/>
